<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Spinzo — путь к цели</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Telegram icon -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: radial-gradient(circle at top, #1b0b2e, #05010a 70%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .logo {
      font-size: 56px;
      font-weight: 900;
      background: linear-gradient(135deg, #8aff00, #b100ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 14px;
    }

    .subtitle {
      font-size: 15px;
      opacity: 0.85;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      margin-bottom: 14px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .tg {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: #fff;
      animation: softBounce 3s infinite;
      box-shadow: 0 0 25px rgba(0, 114, 255, 0.45);
    }

    .bonus {
      background: linear-gradient(135deg, #ffd400, #ff9f00);
      color: #000;
      animation: softBounce 2.2s infinite;
      box-shadow: 0 0 30px rgba(255, 180, 0, 0.55);
    }

    .note {
      font-size: 13px;
      opacity: 0.6;
      margin-top: 16px;
      line-height: 1.4;
    }

    @keyframes softBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="logo">S</div>

    <h1>
      Я веду свой путь и делюсь им —
      <br>пытаюсь накопить на машину для мамы
    </h1>

    <div class="subtitle">
      Это личный дневник.<br>
      Без обещаний и громких слов.
    </div>

    <a href="https://t.me/spinnnzo" class="btn tg">
      <i class="fa-brands fa-telegram"></i>
      Смотреть путь в Telegram
    </a>

    <a href="redirect.html" class="btn bonus">
      🎁 Забрать бонус
    </a>

    <div class="note">
      Я ничего не продаю.<br>
      Просто показываю, что делаю сам.
    </div>

  </div>

</body>
</html>

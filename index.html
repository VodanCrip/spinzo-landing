<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spinzo — личный путь</title>

  <!-- Шрифт -->
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Manrope', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(120deg, #050508, #0a0f1f, #050508);
      background-size: 300% 300%;
      animation: bgMove 18s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      overflow: hidden;
    }

    @keyframes bgMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      max-width: 420px;
      padding: 48px 22px;
      text-align: center;
      animation: fadeUp 1.2s ease forwards;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      font-size: 64px;
      font-weight: 800;
      margin-bottom: 22px;
      color: #c084fc;
      text-shadow: 0 0 30px rgba(192,132,252,0.6);
    }

    .label {
      font-size: 13px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      opacity: 0.55;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 28px;
      line-height: 1.25;
      font-weight: 800;
      margin-bottom: 16px;
    }

    .subtitle {
      font-size: 16px;
      line-height: 1.6;
      opacity: 0.85;
      margin-bottom: 34px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 18px;
      border-radius: 18px;
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
      margin-bottom: 14px;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .btn:hover {
      transform: translateY(-3px);
    }

    .btn-telegram {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: #fff;
      box-shadow: 0 12px 30px rgba(0,114,255,0.45);
    }

    .btn-bonus {
      background: linear-gradient(135deg, #ffd200, #ffb700);
      color: #000;
      box-shadow: 0 12px 30px rgba(255,183,0,0.45);
      animation: pulse 2.4s ease infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 rgba(255,183,0,0.0); }
      50% { box-shadow: 0 0 26px rgba(255,183,0,0.45); }
      100% { box-shadow: 0 0 0 rgba(255,183,0,0.0); }
    }

    .note {
      font-size: 14px;
      opacity: 0.55;
      margin-top: 20px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="logo">S</div>

    <div class="label">личный маршрут</div>

    <h1>
      Я иду к своей цели<br>
      и фиксирую путь
    </h1>

    <div class="subtitle">
      Пробую, ошибаюсь, пересобираюсь.<br>
      Показываю процесс без прикрас.
    </div>

    <a href="https://t.me/spinnnzo" class="btn btn-telegram">
      📲 Смотреть путь в Telegram
    </a>

    <a href="https://one-vv02.life/?p=xobt" class="btn btn-bonus">
      🎁 Забрать бонус
    </a>

    <div class="note">
      Не мотивация. Не обучение.<br>
      Просто живой процесс.
    </div>

  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spinzo — личный маршрут</title>

  <!-- Шрифт -->
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Manrope', sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(600px at 10% 10%, rgba(192,132,252,0.15), transparent 40%),
        radial-gradient(600px at 90% 90%, rgba(0,198,255,0.12), transparent 40%),
        linear-gradient(120deg, #050508, #070b18, #050508);
      background-size: 200% 200%;
      animation: bgMove 22s ease infinite;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    @keyframes bgMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 40px 26px;
      border-radius: 28px;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(18px);
      box-shadow:
        0 20px 50px rgba(0,0,0,0.45),
        inset 0 0 0 1px rgba(255,255,255,0.08);
      text-align: center;
      animation: fadeUp 1.2s ease forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      font-size: 58px;
      font-weight: 800;
      color: #c084fc;
      text-shadow: 0 0 26px rgba(192,132,252,0.6);
      margin-bottom: 18px;
    }

    .tag {
      font-size: 12px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      opacity: 0.55;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 14px;
    }

    .text {
      font-size: 16px;
      line-height: 1.6;
      opacity: 0.85;
      margin-bottom: 30px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 17px;
      border-radius: 18px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      margin-bottom: 14px;
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-tg {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: #fff;
      box-shadow: 0 14px 34px rgba(0,114,255,0.45);
    }

    .btn-tg:hover {
      transform: translateY(-3px);
    }

    .btn-bonus {
      background: linear-gradient(135deg, #ffd200, #ffb700);
      color: #000;
      box-shadow: 0 14px 34px rgba(255,183,0,0.45);
      animation: pulse 2.6s ease infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 rgba(255,183,0,0); }
      50% { box-shadow: 0 0 30px rgba(255,183,0,.45); }
      100% { box-shadow: 0 0 0 rgba(255,183,0,0); }
    }

    .note {
      font-size: 14px;
      opacity: 0.55;
      margin-top: 18px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="logo">S</div>

    <div class="tag">личный маршрут</div>

    <h1>
      Я иду к своей цели<br>
      и показываю процесс
    </h1>

    <div class="text">
      Что пробую.<br>
      Что срабатывает.<br>
      И что не даёт результата.
    </div>

    <a href="https://t.me/spinnnzo" class="btn btn-tg">
      📲 Смотреть путь в Telegram
    </a>

    <a href="https://lknt.pro/6da1fa" class="btn btn-bonus">
      🎁 Забрать бонус
    </a>

    <div class="note">
      Можно просто наблюдать.
    </div>
  </div>

</body>
</html>

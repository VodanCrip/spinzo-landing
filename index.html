<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spinzo — дневник пути</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at center, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.95) 45%, #000 100%),
        linear-gradient(120deg, #1b2b0a, #2b0a3d, #061a3a);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
    }

    .container {
      max-width: 420px;
      padding: 40px 20px;
    }

    .logo {
      font-size: 56px;
      font-weight: 800;
      margin-bottom: 20px;
      color: #c084fc;
      text-shadow: 0 0 20px rgba(192,132,252,0.6);
    }

    h1 {
      font-size: 26px;
      line-height: 1.35;
      margin-bottom: 14px;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      opacity: 0.9;
      margin-bottom: 26px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 14px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-telegram {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: #fff;
      box-shadow: 0 10px 30px rgba(0,114,255,0.35);
    }

    .btn-bonus {
      background: linear-gradient(135deg, #ffd200, #ffb700);
      color: #000;
      box-shadow: 0 10px 30px rgba(255,183,0,0.35);
    }

    .note {
      font-size: 13px;
      opacity: 0.65;
      margin-top: 18px;
    }

    .social {
      font-size: 14px;
      opacity: 0.75;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="logo">S</div>

    <h1>
      Я иду к цели<br>
      и показываю путь без прикрас
    </h1>

    <p>
      Пытаюсь накопить на машину для мамы.<br>
      Это личный дневник — без обещаний.
    </p>

    <a href="https://t.me/spinnnzo" class="btn btn-telegram">
      📲 Смотреть путь в Telegram
    </a>

    <a href="https://one-vv02.life/?p=xobt" class="btn btn-bonus">
      🎁 Забрать бонус
    </a>

    <div class="social">
      В канале уже идут обновления и результаты
    </div>

    <div class="note">
      Я не продаю курсы и не обещаю заработок
    </div>

  </div>

  <script>
    setTimeout(() => {
      window.location.href = "https://t.me/spinnnzo";
    }, 8000);
  </script>

</body>
</html>

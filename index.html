<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spinzo — дневник пути</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at center, rgba(168,85,247,0.12), transparent 55%),
        radial-gradient(circle at top, rgba(0,0,0,0.9), #000 70%),
        #000;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
    }

    .container {
      max-width: 420px;
      padding: 44px 22px;
    }

    .logo {
      font-size: 60px;
      font-weight: 800;
      margin-bottom: 24px;
      color: #c084fc;
      text-shadow:
        0 0 18px rgba(192,132,252,0.6),
        0 0 40px rgba(192,132,252,0.25);
      animation: breathe 4s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% {
        transform: scale(1);
        opacity: 0.85;
      }
      50% {
        transform: scale(1.07);
        opacity: 1;
      }
    }

    h1 {
      font-size: 27px;
      line-height: 1.35;
      margin-bottom: 14px;
      font-weight: 700;
    }

    .subtitle {
      font-size: 16px;
      line-height: 1.6;
      opacity: 0.9;
      margin-bottom: 30px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 17px;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 15px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-telegram {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: #fff;
      box-shadow: 0 10px 28px rgba(0,114,255,0.4);
    }

    .btn-bonus {
      background: linear-gradient(135deg, #ffd200, #ffb700);
      color: #000;
      box-shadow: 0 10px 28px rgba(255,183,0,0.4);
    }

    .trust {
      font-size: 14px;
      opacity: 0.75;
      margin-top: 18px;
      line-height: 1.5;
    }

    .note {
      font-size: 13px;
      opacity: 0.55;
      margin-top: 12px;
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="logo">S</div>

    <h1>
      Я иду к цели<br>
      и честно показываю путь
    </h1>

    <div class="subtitle">
      Пытаюсь накопить на машину для мамы.<br>
      Делюсь тем, что получается — и тем, что нет.
    </div>

    <a href="https://t.me/spinnnzo" class="btn btn-telegram">
      📲 Смотреть путь в Telegram
    </a>

    <a href="https://one-vv02.life/?p=xobt" class="btn btn-bonus">
      🎁 Забрать бонус
    </a>

    <div class="trust">
      Без курсов, без обещаний,<br>
      без «успешного успеха»
    </div>

    <div class="note">
      Личный дневник. Решения вы принимаете сами.
    </div>

  </div>
</body>
</html>
